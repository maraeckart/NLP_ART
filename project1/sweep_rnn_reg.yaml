# stage 1: grid search
#   wandb sweep --entity mara-eckart-nlp --project art-p1 project1/sweep_rnn_reg.yaml
# On GPUHub:  - --accelerator=gpu - --num_workers=4
program: project1/RNN.py
method: grid
metric:
  name: best_val_acc
  goal: maximize
parameters:
  dropout:
    values: [0.2, 0.5]
  hidden_dim:
    values: [128, 256]
  lr:
    values: [0.0001, 0.001, 0.01]
  input_format:
    value: h_last
  patience:
    value: 3
  max_epochs:
    value: 60
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args}
