# 2. sweep
program: project1/word2vec.py
method: grid
metric:
  name: best_val_acc
  goal: maximize
parameters:
  dropout:
    values: [0.0, 0.2, 0.5]
  hidden_dim:
    values: [128, 256, 512]
  lr:
    values: [0.0001, 0.001, 0.01]
  batch_size:
    value: 512 
  patience:
    value: 6
  max_epochs:
    value: 60
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args}
  - --accelerator=gpu
  - --num_workers=4
